<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opsidian 설정</title>
    <style>
      body {
        max-width: 760px;
        margin: 24px auto;
        padding: 0 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #0f172a;
      }
      label { display: block; margin: 12px 0 6px; font-weight: 700; }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px;
      }
      .checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
      }
      .checkbox input { width: auto; }
      .buttons {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      button {
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: #fff;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }
      #testConnection { background: #334155; }
      .hint {
        font-size: 13px;
        color: #475569;
        line-height: 1.5;
      }
      #saved { margin-top: 12px; color: #16a34a; font-weight: 700; white-space: pre-line; }
      code { background: #f1f5f9; padding: 2px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Opsidian 설정</h1>
    <p class="hint">
      Obsidian Local REST API 플러그인 기준입니다. 기본 URL은
      <code>http://127.0.0.1:27123</code> 입니다.
    </p>

    <label for="vaultName">Vault 이름</label>
    <input id="vaultName" placeholder="MyVault" />

    <label for="folder">대화 저장 폴더</label>
    <input id="folder" placeholder="ChatGPT" />

    <label for="dailyFolder">데일리 노트 폴더</label>
    <input id="dailyFolder" placeholder="Daily" />

    <label for="indexNotePath">인덱스 노트 경로</label>
    <input id="indexNotePath" placeholder="ChatGPT/_index.md" />

    <label for="apiBaseUrl">API Base URL</label>
    <input id="apiBaseUrl" placeholder="http://127.0.0.1:27123" />

    <label for="apiKey">API Key</label>
    <input id="apiKey" type="password" placeholder="obsidian-local-rest-api key" />

    <label class="checkbox"><input id="appendDailyLinks" type="checkbox" /> 데일리 노트에 링크 추가</label>
    <label class="checkbox"><input id="updateIndex" type="checkbox" /> 인덱스 노트 갱신</label>

    <div class="buttons">
      <button id="save">저장</button>
      <button id="testConnection" type="button">연결 테스트</button>
    </div>
    <div id="saved"></div>

    <script type="module" src="./options.js"></script>
  </body>
</html>
